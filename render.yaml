services:
  - type: web
    name: crypto-paper-trading-arena
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/dashboard/app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
