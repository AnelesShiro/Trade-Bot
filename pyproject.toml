[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-paper-trading-arena"
version = "0.1.0"
description = "Paper trading competition platform for OpenClaw crypto agents."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/dashboard/app.py",
    "src/cli.py",
    "src/main.py",
    "src/agents/base_agent.py",
    "src/agents/deepseek_agent.py",
    "src/agents/grok_agent.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
