competition:
  name: crypto-paper-trading-arena
  duration_days: 0
  weekly_target_pct: 0.07
  poll_interval_seconds: 3600
  event_cooldown_seconds: 1800
  symbol: BTC/USDT:USDT
  display_symbol: BTCUSDT
  timeframe: 1h
  ohlcv_limit: 240

accounts:
  initial_equity: 10000.0
  quote_currency: USDT

risk:
  max_leverage: 10.0
  max_margin_per_action_pct: 0.10
  max_total_account_risk_pct: 0.02
  max_open_positions: 3
  max_dca_per_position: 2
  daily_loss_limit_pct: 0.03
  min_rr_tp1: 1.5
  min_rr_tp2: 2.0

market:
  exchange: binanceusdm
  sandbox: false
  fetch_funding: true
  fetch_open_interest: true

shared_learning:
  enabled: true
  shared_ratio: 0.30
  private_ratio: 0.70
  min_sample_size: 10
  min_win_rate: 0.60
  min_profit_factor: 1.5
  compatibility_threshold: 0.50
  agreement_threshold: 0.85
  reduced_shared_ratio: 0.10

api:
  timeout_seconds: 180
  max_retries: 1
  backoff_initial_seconds: 1.0
  backoff_multiplier: 2.0

execution:
  taker_fee_rate: 0.0005
  slippage_bps: 2.0

risk_automation:
  enabled: true
  conditional_orders:
    enabled: true
  trailing_stop:
    enabled: true
    apply_by_default: false
    mode: percent
    distance_pct: 0.01
    atr_multiple: 1.5
    step_pct: 0.005
  break_even:
    enabled: true
    apply_by_default: true
    trigger: r_multiple
    r_multiple: 1.0
    percent_gain: 0.01
    fee_buffer_pct: 0.0005
  time_exit:
    enabled: true
    apply_by_default: false
    max_hold_hours: 24.0
  cooldown:
    enabled: true
    consecutive_losses: 3
    pause_hours_after_losses: 6.0
    daily_loss_pct: 0.05
    pause_hours_daily: 24.0
    weekly_drawdown_pct: 0.10
    pause_hours_weekly: 24.0
    rejection_rate_threshold: 0.80
    api_failure_threshold: 5
  api_failover:
    enabled: true

safety:
  warmup_cycles: 0
  kill_switch_file: KILL_SWITCH
  require_preflight_for_live: true
  minimum_free_disk_mb: 500
  downtime_threshold_seconds: 60
  position_monitor_enabled: true
  position_monitor_interval_seconds: 15

hot_reload:
  enabled: true
  auto_detect_changes: true
  check_interval_seconds: 5
  rollback_backups_to_keep: 10

cloud_dashboard:
  enabled: true
  snapshot_path: cloud/dashboard_snapshot.json
  git_auto_push: true
  git_branch: main
  push_after_each_cycle: true
  min_push_interval_seconds: 300
  render_enabled: true
  stale_warning_minutes: 15
  stale_critical_minutes: 60

features:
  improved_shared_learning: true
  event_driven_tp_sl: true
  advanced_risk_model: false
  cloud_sync: true

canary:
  enabled: false
  target_agents:
    - crypto-deepseek

feature_flags:
  canary_prompt_context:
    enabled: false
    agents: []
  experimental_risk_model:
    enabled: false
    agents:
      - crypto-deepseek

agents:
  - id: crypto-deepseek
    name: Crypto DeepSeek
    session_id: crypto-deepseek
    llm:
      LLM_PROVIDER: deepseek
      LLM_MODEL: deepseek-v4-flash
      LLM_BASE_URL: ""
      LLM_API_KEY: DEEPSEEK_API_KEY
      LLM_ALLOW_FALLBACK: false
    api_failover:
      enabled: true
      retest_interval_seconds: 3600
      fallback_chain:
        - provider: "openai"
          model: "qwen3-max"
          LLM_BASE_URL: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
          LLM_API_KEY: QWEN_API_KEY
  - id: crypto-qwen
    name: Crypto Qwen
    session_id: crypto-qwen
    llm:
      LLM_PROVIDER: "openai"
      LLM_MODEL: "qwen3-max"
      LLM_BASE_URL: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
      LLM_API_KEY: QWEN_API_KEY
      LLM_ALLOW_FALLBACK: false
    api_failover:
      enabled: true
      retest_interval_seconds: 3600
      fallback_chain:
        - provider: deepseek
          model: deepseek-v4-flash
          LLM_BASE_URL: ""
          LLM_API_KEY: DEEPSEEK_API_KEY

paths:
  database: database/arena.db
  rulebook: config/rulebook.md
  outputs_dir: outputs
  signals: outputs/SIGNALS.md
  ledger: outputs/LEDGER.csv
  evaluation: outputs/EVALUATION.md
  logs_dir: logs
